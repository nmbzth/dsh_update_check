name: src-check

on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', '.github/workflows/**']
  pull_request:
    paths: ['src/**', 'scripts/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run source checks
        run: node scripts/check-src.js
